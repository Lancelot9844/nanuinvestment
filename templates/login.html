{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Nanu Investment Pvt. Ltd</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <style>
    :root {
      --primary-blue: #1a237e;
      --accent-red: #d32f2f;
      --text-main: #333333;
      --bg-light: #f8f9fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg-light);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
    }

    .login-panel {
      width: min(100%, 420px);
      background: #ffffff;
      border: 1px solid #e6e6ee;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .login-logo {
      width: 180px;
      margin: 0 auto 20px;
    }

    h1 {
      color: var(--primary-blue);
      font-size: 1.6rem;
      margin: 0 0 8px;
    }

    p {
      color: #666666;
      margin: 0 0 22px;
      line-height: 1.6;
    }

    .login-button {
      display: inline-block;
      width: 100%;
      padding: 12px 18px;
      border-radius: 4px;
      background: var(--primary-blue);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .login-button:hover {
      background: var(--accent-red);
    }

    .secondary-login-button {
      margin-top: 10px;
      background: #178b6f;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="login-panel">
    <img src="{% static 'logo.jpeg' %}" alt="Nanu Investment logo" class="login-logo">
    <h1>Login</h1>
    <p>Choose the right login area for your account.</p>
    <a class="login-button" href="{% url 'customer_login' %}">Customer Login</a>
    <a class="login-button secondary-login-button" href="{% url 'admin:index' %}">Admin / Staff Login</a>
    <a class="back-link" href="{% url 'home' %}">Back to website</a>
  </main>
</body>
</html>

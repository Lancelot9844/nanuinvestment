{% extends "admin/base_site.html" %}

{% block content %}
<div class="admin-card">
  <h1>Reset Customer Password</h1>
  <p><strong>{{ customer.customer_id }}</strong> - {{ customer.full_name }}</p>
  <p>Username: <strong>{{ customer.user.get_username }}</strong></p>

  <form method="post" class="admin-form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <label class="password-sms-option">
      <input type="checkbox" name="send_password_sms" value="yes"{% if send_password_sms %} checked{% endif %}>
      <span>
        <strong>Send this temporary password by SMS</strong>
        <small>The password is sent once through AakashSMS and is not stored in the database or SMS log.</small>
      </span>
    </label>
    <div class="submit-row">
      <input type="submit" value="Reset password">
      <a class="button" href="{% url 'admin:myapp_customer_change' customer.pk %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

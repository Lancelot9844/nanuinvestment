{% extends "admin/base_site.html" %}

{% block content %}
<div class="admin-card">
  <h1>Reset Customer Password</h1>
  <p><strong>{{ customer.customer_id }}</strong> - {{ customer.full_name }}</p>
  <p>Username: <strong>{{ customer.user.get_username }}</strong></p>

  <form method="post" class="admin-form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
      <input type="submit" value="Reset password">
      <a class="button" href="{% url 'admin:myapp_customer_change' customer.pk %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

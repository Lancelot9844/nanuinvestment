{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Ticket | Nanu Investment</title>
  <link rel="stylesheet" href="{% static 'admin-modern.css' %}">
</head>
<body class="customer-portal">
  <main class="customer-auth-shell">
    <section class="customer-auth-card customer-ticket-card">
      <h1>Create Ticket</h1>
      <p>{{ customer.customer_id }} - {{ customer.full_name }}</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit Ticket</button>
        <a class="customer-back-link" href="{% url 'customer_dashboard' %}">Back to dashboard</a>
      </form>
    </section>
  </main>
</body>
</html>

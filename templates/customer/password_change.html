{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password | Nanu Investment</title>
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="stylesheet" href="{% static 'admin-modern.css' %}">
</head>
<body class="customer-portal">
  <main class="customer-auth-shell">
    <section class="customer-auth-card customer-ticket-card">
      <h1>Change Password</h1>
      <p>{{ customer.customer_id }} - {{ customer.full_name }}</p>
      {% if password_change_required %}
        <p class="customer-password-required">For security, change the temporary password before continuing to E-Banking.</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Password</button>
        <a class="customer-back-link" href="{% url 'customer_dashboard' %}">Back to dashboard</a>
      </form>
    </section>
  </main>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings | Nanu Investment</title>
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="stylesheet" href="{% static 'admin-modern.css' %}">
</head>
<body class="customer-portal">
  <main class="customer-auth-shell">
    <section class="customer-auth-card customer-ticket-card">
      <h1>Profile Settings</h1>
      <p>{{ customer.customer_id }} - {{ customer.full_name }}</p>
      <div class="customer-profile-preview">
        <span class="customer-profile-photo customer-profile-photo-large">
          {% if customer.profile_photo %}
            <img src="{{ customer.profile_photo.url }}" alt="">
          {% else %}
            {{ customer.full_name|default:customer.customer_id|first|upper }}
          {% endif %}
        </span>
      </div>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Profile Photo</button>
        <a class="customer-back-link" href="{% url 'customer_dashboard' %}">Back to dashboard</a>
      </form>
    </section>
  </main>
</body>
</html>
